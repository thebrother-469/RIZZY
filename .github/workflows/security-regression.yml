name: Security Regression

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *" # nightly at 06:00 UTC

jobs:
  supabase-linter-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - run: bun install --frozen-lockfile

      # Precheck: require SUPABASE_ACCESS_TOKEN + SUPABASE_PROJECT_REF up
      # front. Missing → fail the job immediately with a clear message so
      # operators know exactly which secret to configure. Scheduled runs
      # and push/workflow_dispatch must never silently no-op — that would
      # hide security drift.
      - name: Precheck required GitHub Secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          missing=()
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then missing+=("SUPABASE_ACCESS_TOKEN"); fi
          if [ -z "${SUPABASE_PROJECT_REF:-}" ]; then missing+=("SUPABASE_PROJECT_REF"); fi
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error title=Missing GitHub Secret(s)::security-regression cannot run without: ${missing[*]}"
            echo ""
            echo "Configure the following repository secrets under Settings → Secrets and variables → Actions:"
            for s in "${missing[@]}"; do
              echo "  - $s"
            done
            echo ""
            echo "SUPABASE_ACCESS_TOKEN: personal access token from https://supabase.com/dashboard/account/tokens"
            echo "SUPABASE_PROJECT_REF:  project ref (e.g. jfiojbbrdfgeruborkzx) from your project's General Settings"
            exit 1
          fi
          echo "All required security-regression secrets are present."

      - name: Install supabase CLI
        run: |
          curl -fsSL https://github.com/supabase/cli/releases/latest/download/supabase_linux_amd64.tar.gz \
            | tar -xz -C /usr/local/bin supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Run Supabase linter → JSON report
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          mkdir -p security-artifacts
          supabase inspect db --linked --project-ref "$PROJECT_REF" \
            > security-artifacts/db-inspect.json || true
          supabase db lint --linked --project-ref "$PROJECT_REF" --level warning \
            --output json > security-artifacts/lint.json || true
          echo "Linter report:"
          cat security-artifacts/lint.json || true

      - name: Regression checks (RLS / SECURITY DEFINER / anon auth)
        run: bun run scripts/security-regression.ts security-artifacts/lint.json
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Upload security artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-regression-${{ github.run_id }}
          path: security-artifacts/
          if-no-files-found: warn
