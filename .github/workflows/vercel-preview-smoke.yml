name: Preview Deployment Smoke

# Runs the canonical smoke journey against a freshly deployed preview URL
# (Vercel / Lovable preview). Never blocks a merge on its own — the release
# gate does that — but surfaces a real-environment failure immediately.

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      preview_url:
        description: "Preview URL to smoke test (https://...)"
        required: true
        type: string

concurrency:
  group: preview-smoke-${{ github.event.deployment_status.target_url || inputs.preview_url }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Preview smoke journey
    # deployment_status fires for every state; only run on a live preview.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment_status.environment != 'production')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PREVIEW_URL: ${{ github.event.deployment_status.target_url || inputs.preview_url }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      E2E_TEST_USER_EMAIL: ${{ secrets.E2E_TEST_USER_EMAIL }}
      E2E_TEST_USER_PASSWORD: ${{ secrets.E2E_TEST_USER_PASSWORD }}
      RUN_PLAYWRIGHT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'bun.lockb', 'package.json') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile

      - name: Resolve the preview target
        run: |
          set -euo pipefail
          if [ -z "${PREVIEW_URL:-}" ]; then
            echo "::error::No preview URL available for this event."
            exit 1
          fi
          echo "E2E_BASE_URL=$PREVIEW_URL"        >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_BASE_URL=$PREVIEW_URL" >> "$GITHUB_ENV"
          echo "### Preview smoke target" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: $PREVIEW_URL"      >> "$GITHUB_STEP_SUMMARY"

      - name: Wait for the preview to answer
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$PREVIEW_URL" || true)
            echo "attempt $i -> $code"
            [ "$code" = "200" ] && exit 0
            sleep 5
          done
          echo "::error::Preview never returned 200."
          exit 1

      - name: Secret preflight (fail fast)
        run: bun run ci:secrets preview

      - run: bunx playwright install --with-deps chromium

      - name: Public surface smoke
        run: bunx playwright test tests/playwright/homepage.smoke.spec.ts tests/playwright/public-api.smoke.spec.ts

      - name: Canonical journey smoke
        env:
          SMOKE_RUN_ID: preview-${{ github.run_id }}-${{ github.run_attempt }}
        run: bunx playwright test tests/playwright/production-smoke.spec.ts

      - name: Publish the smoke summary
        if: always()
        run: bun run ci:summary || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview-smoke-evidence
          path: |
            test-results/
            playwright-report/
            security-artifacts/
          if-no-files-found: ignore
